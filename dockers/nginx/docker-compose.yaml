services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx_revproxy
    networks:
      - pr007_mlops_network
    env_file:
      - ../../.env          
    ports:
      - "8080:80"
      - "443:443"
      - "8081:8081"   # port stats interne
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx.crt:/etc/nginx/certs/nginx.crt:ro
      - ./certs/nginx.key:/etc/nginx/certs/nginx.key:ro      
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./auth.conf:/etc/nginx/auth.conf:ro
      - ./proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro 
    depends_on:
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      api:
        condition: service_healthy  # ← attend que l'API soit healthy

    extra_hosts:
      - "airflow-webserver:${AIRFLOW_HOST}"   # ✅ ici directement

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    networks:
      - pr007_mlops_network
    env_file:
      - ../../.env          
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    environment:
      SCRAPE_URI: http://nginx:8081/nginx_status   # on passe par le port 8081 pour les stats - séparation des ports


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    networks:
      - pr007_mlops_network 
    env_file:
      - ../../.env          
    expose:
      - "9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
      - --web.enable-lifecycle

  pushgateway:
    image: prom/pushgateway
    container_name: pr007-pushgateway-1
    networks:
      - pr007_mlops_network
    expose:
      - "9091"
    command:
      - --persistence.file=/data/pushgateway.db
    volumes:
      - pushgateway_data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    networks:
      - pr007_mlops_network
    env_file:
      - ../../.env  
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      #- GF_SERVER_ROOT_URL=https://%(domain)s/grafana/   # ✅💀
      #- GF_SERVER_ROOT_URL=https://${AIRFLOW_HOST:-localhost}/grafana/ 
      #- GF_SERVER_SERVE_FROM_SUB_PATH=true               # ✅💀
      # ROOT_URL            →  URLs absolues correctes       ✅
      # SERVE_FROM_SUB_PATH →  assets relatifs au sous-chemin  ✅
      # Les deux ensemble   →  Grafana fonctionne derrière nginx ✅

volumes:
  prometheus_data:
  grafana_data:
  pushgateway_data:

networks:
  pr007_mlops_network:
    external: true