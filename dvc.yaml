vars:
  - cluster_values:
      c5: 5
      c10: 10
      c15: 15

stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
    - data/avis_40k.csv
    - src/preprocess.py
    outs:
    - data/avis_cleaned.csv
  nlp_simple:
    cmd: python src/preprocess_nlp.py
    deps:
    - data/avis_cleaned.csv
    - src/preprocess_nlp.py
    outs:
    - data/avis_nlp.csv
  spacy_lemmatization:
    cmd: python src/preprocess_spacy.py
    deps:
    - data/avis_cleaned.csv
    - src/preprocess_spacy.py
    outs:
    - data/avis_bertopic.csv
  train:
    foreach: ${cluster_values}
    do:
      cmd: python src/train.py -v -nc ${item} -o models/${key}
      deps:
        - data/avis_bertopic.csv
        - src/train.py
      outs:
        - models/${key}/artifacts
  evaluate:
    foreach: ${cluster_values}
    do:
      cmd: python src/evaluate.py -v -f models/${key}/artifacts/clusterized.csv -ri models/${key}/last_run_id.txt -ap models/${key}/artifacts -mo metrics/${key}/silhouette.json
      deps:
        - src/evaluate.py
        - models/${key}/artifacts/clusterized.csv
        - models/${key}/last_run_id.txt
      metrics:
        - metrics/${key}/silhouette.json 
