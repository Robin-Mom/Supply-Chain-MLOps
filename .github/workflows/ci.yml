name: Supply Chain MLOps CI

on:
  push:
    branches: [ main, feat/ci-pipeline ] # Ajout de la branche pour tester la CI immédiatement
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    
    # On injecte les variables d'environnement pour TOUT le job de CI
    env:
      MLFLOW_TRACKING_URI: "https://dagshub.com/schmilblick-ai/Supply-Chain-MLOps.mlflow"
      MLFLOW_TRACKING_USERNAME: "marv1-ops"
      # Le mot de passe reste secret, on va le chercher dans les secrets GitHub
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      # Vos tests unitaires auront maintenant accès aux variables MLflow !
      - name: Run unit tests
        run: |
          uv run pytest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: supply-chain-mlops-api:test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max