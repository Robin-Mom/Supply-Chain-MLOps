name: Supply Chain MLOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    
    env:
      MLFLOW_TRACKING_URI: "https://dagshub.com/schmilblick-ai/Supply-Chain-MLOps.mlflow"
      MLFLOW_TRACKING_USERNAME: "marv1-ops"
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      DAGSHUB_CLIENT_TOKEN: ${{ secrets.DAGSHUB_CLIENT_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --all-groups
          # On installe dagshub pour s'assurer que les drivers HTTP/DVC sont présents
          uv pip install dagshub

      - name: Pull Data and Models from DVC
        run: |
          # Configuration dynamique du remote pour utiliser le token DagsHub pur
          uv run dvc remote modify origin --local auth token
          uv run dvc remote modify origin --local user marv1-ops
          uv run dvc remote modify origin --local password ${{ secrets.DAGSHUB_CLIENT_TOKEN }}
          
          # Téléchargement sécurisé des artefacts pour les tests unitaires
          uv run dvc pull

      - name: Run unit tests
        run: |
          uv run pytest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/api.Dockerfile 
          tags: supply-chain-mlops-api:test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max