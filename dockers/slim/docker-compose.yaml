services:
  # Service 1 : L'API (Inférence) Oscaro Trust Pilot
  common:
    build:
      context: ../..
      dockerfile: ${DOCKFLD}Dockerfile
      args:
        BACKEND: ${BACKEND:-cpu}
        DOCKFLD: ${DOCKFLD}
        #DAGSHUB_TOKEN: ${DAGSHUB_TOKEN}
    image: ${COMPOSE_PROJECT_NAME:-mlopsv}-app:${API_VERSION:-1.0.0}
    profiles:
      - building        # ← exclu du up classique
    command: echo "build only"   # ← ne fait rien, juste pour le build
  
  api:
    build:
      context: ../..
      dockerfile: ${DOCKFLD}Dockerfile
      args:
        BACKEND: ${BACKEND:-cpu}
        DOCKFLD: ${DOCKFLD}
    image: ${COMPOSE_PROJECT_NAME:-mlopsv}-app:${API_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    volumes:
      - ../../.:/app # Permet de voir les modifs de code en temps réel (développement)
      - /app/.venv
    env_file:
      - ../../.env
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s      # vérifie toutes les 5s
      timeout: 3s
      retries: 10        # considère healthy après 10 succès
      start_period: 60s # laisse 60s à l'API pour télécharger les modèles DVC/HuggingFace

  # Service 2 : Le Trainer (Cycle de vie ML)
  trainer:
    image: ${COMPOSE_PROJECT_NAME:-mlopsv}-app:${API_VERSION:-1.0.0}           # ← réutilise l'image buildée par api
    profiles:
      - training               # ← exclu du up classique ✅
    volumes:
      - ../../.:/app
    env_file:
      - ../../.env
    # Ce container s'éteint tout seul une fois l'entraînement fini
    command: ["dvc", "repro", "--force"]

# app/docker-compose.yaml — rejoindre le réseau
networks:
  airflow_default:
    external: true               # réseau déjà créé par la stack Airflow
    name: airflow_default