name: Supply Chain MLOps CI

on:
  push:
    branches: [ main, feat/ci-pipeline ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧹 ÉTAPE DE NETTOYAGE DU DISQUE (Indispensable pour les gros conteneurs ML)
      - name: Free Disk Space (Ubuntu Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/lib/jvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape cruciale : On crée le fichier .env que tes conteneurs attendent (env_file)
      - name: Create .env file for Docker Compose
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/schmilblick-ai/Supply-Chain-MLOps.mlflow" >> .env
          echo "MLFLOW_TRACKING_USERNAME=marv1-ops" >> .env
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> .env
          echo "DAGSHUB_CLIENT_TOKEN=${{ secrets.DAGSHUB_CLIENT_TOKEN }}" >> .env

      # Optionnel mais évite les crashs si le réseau externe d'Airflow n'existe pas sur la CI
      - name: Create dummy external network for Airflow
        run: docker network create airflow_default || true

      # 🔐 Nettoyage du remote et pull dans un SEUL et même conteneur
      - name: Pull Data and Models from DVC via Docker
        run: |
          docker compose run --rm \
            -e DAGSHUB_TOKEN="${{ secrets.DAGSHUB_CLIENT_TOKEN }}" \
            trainer sh -c "
              dvc remote remove origin && \
              dvc remote add origin https://dagshub.com/schmilblick-ai/Supply-Chain-MLOps.dvc && \
              dvc remote modify origin --local user marv1-ops && \
              dvc remote modify origin --local password \$DAGSHUB_TOKEN && \
              dvc pull
            "

      # On lance les tests unitaires à l'intérieur du conteneur trainer (qui a tout son environnement Python prêt)
      - name: Run unit tests via Docker
        run: |
          docker compose run --rm trainer pytest tests/

      # On valide le build de l'image de production/inférence de ton API
      - name: Build API Docker image
        run: |
          docker compose build api