#definition du Server Block 
events {
    worker_connections 1024; # Nombre maximum de connexions par processus
}
http {
    # Dans ton nginx.conf — surcharger combined
    log_format combined1 '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'host=$host';    # ← ajouter ici ✅

    access_log /var/log/nginx/access.log combined1;

    # Définit la zone de limitation
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    # dans notre architecture on a api, airflow, prometheus, grafana
    # Définition de notre serveur virtuel
    # définissons notre architecture
    #           Internet
    #               │
    #               ▼
    #           ┌─────────────────────────────────────┐
    #           │           NGINX :80 / :443          │  ← point d'entrée unique
    #           └─────────────────────────────────────┘
    #             │         │           │        │
    #             ▼         ▼           ▼        ▼
    #           /api     /airflow   /grafana /prometheus
    #           :8000     :8080      :3000     :9090
    #
    #           Soit 5 services à faire collaborer et configurer

    upstream api             { server api:8000; }
    upstream airflow         { server airflow-webserver:8080; }
    #va pas upstream airflow { server ${AIRFLOW_HOST}:8080; }
    upstream airflow         { server ${AIRFLOW_HOST}:8080;}
    upstream prometheus      { server prometheus:9090; }
    upstream grafana         { server grafana:3000; }
    upstream pushgateway     { server pushgateway:9091; }

    #AVONS NOUS QUOI QUE CE SOIT A MAPPER CONDITIONNELEMENT ? non
    ## $http_x_experiment_group = valeur du header X-Experiment-Group
    ## nginx passe en lowercase et mes - en _ automatiquement pour les headers

    #map $http_x_experiment_group $api_v_backend {
    #    "debug"   "api_v2";
    #    default   "api_v1";
    #}

    # Dans http{} pour healthcheck
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    server {
        listen 80;
        server_name localhost; # Nom de domaine ou IP que ce bloc serveur gère
        # Redirige toutes les requêtes HTTP vers HTTPS
        return 301 https://$host$request_uri;
    }

    # Définition de notre nouveau serveur https
    server {
        listen 443 ssl; # Écoute sur le port 443 et active SSL
        server_name localhost; # Nom de domaine ou IP que ce serveur gère
        # Chemins vers les certificats SSL à l'intérieur du conteneur Nginx
        # Définir et servir ces certificats est un challenge -A VOIR les bonnes pratiques
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # Protocoles et chiffrements SSL
        ssl_protocols TLSv1.2 TLSv1.3; # N'autorise que les versions modernes de TLS
        ssl_ciphers HIGH:!aNULL:!MD5; # Liste des suites de chiffrement autorisées
        ssl_prefer_server_ciphers on; # Préfère les chiffrements du serveur
        
        # Bloquer les requêtes sans Host header valide
        #if ($host !~* "^(10\.0\.0\.1|lioravm77gi|liora-vm-77gi|liora_vm_77gi|nginx)$") {
        #    return 444;   # ← ferme la connexion sans réponse
        #}

        # health — pas d'auth
        location /health {
            proxy_pass http://api/health;
            include proxy_headers.conf;
        }

        # Toutes les requêtes qui commencent par /predict/ seront traitées ici
        # observons l'api proposé par l'équipe : / /predict /metrics /health /train
        location /predict {
            include /etc/nginx/auth.conf;
            # Applique la limitation au bloc "location /predict"
            limit_req zone=apilimit burst=5 nodelay;
            # proxy_pass: Redirige la requête vers le groupe upstream
            # proxy_pass http://$api_v_backend;
            proxy_pass http://api/predict;
            include /etc/nginx/proxy_headers.conf; 
        }

        location /train {
            include /etc/nginx/auth.conf;
            proxy_pass http://api/train;
            include /etc/nginx/proxy_headers.conf; 
        }

        location / {
            include /etc/nginx/auth.conf;
            proxy_pass http://api/;
            include /etc/nginx/proxy_headers.conf; 
        }

        location /openapi.json {
            include /etc/nginx/auth.conf;
            proxy_pass http://api/openapi.json;
        }

        location /logout {
            return 401;
            auth_basic "logout";
            add_header WWW-Authenticate 'Basic realm="logout"';
        }

        location /prometheus/ {
            include /etc/nginx/auth.conf;
            proxy_pass http://prometheus/prometheus/;
            include /etc/nginx/proxy_headers.conf;
            # optionnel — restreindre par IP
            #allow 10.0.0.0/8;
            #allow 127.0.0.1;
            #allow 172.19.0.0/16;
            #allow 34.246.195.129;
            #deny all;
        }

        location /grafana/ {
            include /etc/nginx/auth.conf;
            proxy_pass http://grafana/;   # ← slash final crucial ✅
            include /etc/nginx/proxy_headers.conf;
            #allow 127.0.0.1; # Autorise l'accès uniquement depuis localhost (l'exporter)
            #allow 172.19.0.0/16; # Ou depuis le réseau Docker Subnet -> docker network inspect pr001_default | grep -E "Subnet|Gateway"
            #allow 172.19.0.0/16;
            #deny all;
        }
        
        location /airflow-proxy/ {
            #deux options 1/ include nginx auth, and decom
            #include /etc/nginx/auth.conf;
            proxy_pass http://airflow/;   # ← slash final crucial ✅
            #proxy_pass http://airflow;
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect off;
        }

        #util pour debug
        location /pushgateway/ {
            include /etc/nginx/auth.conf;
            proxy_pass http://pushgateway/;
            include proxy_headers.conf;
        }

        listen 8081;  # ← port stats séparé
        location /nginx_status {
            stub_status on; # Active le module stub_status
            access_log off; # Ne pas logguer les accès à cet endpoint
            allow 127.0.0.1; # Autorise l'accès uniquement depuis localhost (l'exporter)
            allow 172.19.0.0/16; # Ou depuis le réseau Docker Subnet -> docker network inspect pr001_default | grep -E "Subnet|Gateway"

                # ✅ Formes valides
                # allow 127.0.0.1;          # IPv4 loopback
                # allow ::1;                # IPv6 loopback
                # allow 172.16.0.0/12;      # CIDR réseau Docker
                # allow 192.168.1.0/24;     # CIDR réseau local

                # ❌ Formes invalides
                # allow localhost;          # nom DNS → erreur
                # allow monserveur.local;   # idem

            # ==> docker network inspect mlops_default | less # puis faire un search / Subnet
            deny all; # Bloque tout autre accès
        }

        # Si nginx sert son propre favicon
        #location = /favicon.ico {
        #    # ← à supprimer ou forwarder vers l'api
        #    proxy_pass http://api/favicon.ico; 
        #}

    }
}