version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pr007-api-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s    # Augmenté car le chargement du modèle est lourd
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src     # Montre uniquement le code source, pas tout le dossier
      - ./models:/app/models
    env_file:
      - .env
    # Suppression du --reload pour la stabilité en mode production
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - mlops_network      # Connecté au réseau interne

  trainer:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    container_name: pr007-trainer
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge