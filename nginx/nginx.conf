user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Omit query strings, authorization headers and request bodies.
    log_format inference '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout inference;

    upstream inference_api {
        zone inference_api 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        server api:8000 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2m;
        client_body_timeout 30s;
        send_timeout 120s;

        # NGINX normalizes percent escapes, dot segments and repeated slashes
        # before matching locations. Block redirects and suffix variants too.
        location ~* "^/metrics(?:[/;]|$)" {
            return 403;
        }

        location / {
            # No URI suffix: retain the original path and query string.
            proxy_pass http://inference_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_cache off;
            proxy_intercept_errors off;
            # Do not replay prediction requests after an upstream error.
            proxy_next_upstream off;
        }
    }
}
