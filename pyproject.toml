[project]
name = "supply-chain-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bertopic>=0.17.4",
    "bs4>=0.0.2",
    "dagshub>=0.7.0",
    "dvc[s3]>=3.67.1",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "requests>=2.33.1",
    "seaborn>=0.13.2",
    "spacy>=3.8.14",
    "wordcloud>=1.9.6",
    "dvc>=3.67.1",
    "github-cli>=1.0.0",
    "ipython>=9.12.0",
    "jq>=1.11.0",
    "mlflow>=2.12",
    "numpy>=2.4.4",
    "pandas<3",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
cpu = ["torch>=2.0"]
gpu = ["torch>=2.0"]

# ← dire à uv que cpu et gpu ne peuvent pas coexister
[tool.uv]
conflicts = [[{ extra = "cpu" },{ extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url  = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu",   extra = "cpu" },
    { index = "pytorch-cu124", extra = "gpu" },
]
