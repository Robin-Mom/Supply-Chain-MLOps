stages:
  embed:
    foreach: ${encoders}
    do:
      cmd: python src/embed.py --params params.yaml --encoder ${key}
      deps:
        - data/train_eval/train_20k.csv
        - data/train_eval/eval_4k.csv
        - src/embed.py
        - src/experiment.py
        - pyproject.toml
        - uv.lock
      params:
        - data
        - encoders.${key}
        - embedding
      outs:
        - models/embeddings/${key}

  train:
    cmd: python src/train.py --params params.yaml
    deps:
      - models/embeddings/${experiment.encoder}/train.npy
      - models/embeddings/${experiment.encoder}/train.json
      - data/train_eval/train_20k.csv
      - src/train.py
      # Evaluation data enters the sweep identity, never estimator.fit().
      - data/train_eval/eval_4k.csv
      - src/embed.py
      - src/predict.py
      - src/evaluate.py
      - src/experiment.py
      - src/tracking.py
      - pyproject.toml
      - uv.lock
    params:
      - data
      - encoders
      - clustering
      - exploration
      - experiment
      - evaluation
      - selection
      - tracking
    outs:
      - models/runs/${experiment.encoder}/${experiment.method}/${experiment.seed}

  predict:
    cmd: python src/predict.py --params params.yaml
    deps:
      - models/runs/${experiment.encoder}/${experiment.method}/${experiment.seed}
      - models/embeddings/${experiment.encoder}/eval.npy
      - models/embeddings/${experiment.encoder}/eval.json
      - data/train_eval/eval_4k.csv
      - src/predict.py
      - src/train.py
      - src/experiment.py
      - pyproject.toml
      - uv.lock
    params:
      - data
      - encoders.${experiment.encoder}
      - clustering
      - experiment
    outs:
      - models/predictions/${experiment.encoder}/${experiment.method}/${experiment.seed}

  evaluate:
    cmd: python src/evaluate.py --params params.yaml
    deps:
      - models/runs/${experiment.encoder}/${experiment.method}/${experiment.seed}
      - models/predictions/${experiment.encoder}/${experiment.method}/${experiment.seed}
      - models/embeddings/${experiment.encoder}/eval.npy
      - models/embeddings/${experiment.encoder}/eval.json
      - data/train_eval/eval_4k.csv
      - src/evaluate.py
      - src/train.py
      - src/experiment.py
      - src/tracking.py
      - pyproject.toml
      - uv.lock
    params:
      - data
      - encoders.${experiment.encoder}
      - clustering
      - experiment
      - evaluation
      - selection
      - exploration
      - tracking
    outs:
      - models/evaluations/${experiment.encoder}/${experiment.method}/${experiment.seed}/result.json
    metrics:
      - models/evaluations/${experiment.encoder}/${experiment.method}/${experiment.seed}/metrics.json
