services:
  api:
    image: supply-chain-inference:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    # This ignored file is read by Compose, never copied into the image.
    env_file:
      - .env.docker.local
    environment:
      SUPPLY_CHAIN_SELECTION_PATH: ${SUPPLY_CHAIN_SELECTION_PATH:-/app/config/selection.json}
      SUPPLY_CHAIN_ENV_FILE: /app/config/no-local-env
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - type: bind
        source: ${SUPPLY_CHAIN_SELECTION_FILE:-./config/selection.docker.json}
        target: ${SUPPLY_CHAIN_SELECTION_PATH:-/app/config/selection.json}
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: huggingface-cache
        target: /cache/huggingface
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  nginx:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - type: bind
        source: ./monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: prometheus-data
        target: /prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.grafana.local
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$$GF_SECURITY_ADMIN_USER" ] || [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "Set Grafana administrator credentials in .env.grafana.local before startup." >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      - type: bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  huggingface-cache:
  prometheus-data:
  grafana-data:
