[project]
name = "supply-chain-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bertopic>=0.17.4",
    "bs4>=0.0.2",
    "dagshub>=0.7.0",
    "dvc[s3]>=3.67.1",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "requests>=2.33.1",
    "seaborn>=0.13.2",
    "spacy>=3.8.14",
    "wordcloud>=1.9.6",
    "dvc>=3.67.1",
    "github-cli>=1.0.0",
    "ipython>=9.12.0",
    "jq>=1.11.0",
    "mlflow>=2.12",
    "numpy>=2.4.4",
    "pandas<3",
    "sympy==1.12",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]